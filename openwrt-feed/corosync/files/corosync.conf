# Corosync 3 OpenWrt Cluster Configuration
# Edit with your cluster node IPs and settings.

totem {
    version: 2
    cluster_name: openwrt-cluster
    transport: knet
    crypto_cipher: aes256
    crypto_hash: sha256
    ip_version: ipv4
}

nodelist {
    node {
        ring0_addr: 192.168.1.1
        nodeid: 1
        name: openwrt-router
    }
}

quorum {
    provider: corosync_votequorum
    expected_votes: 1
}

logging {
    to_logfile: yes
    logfile: /var/log/corosync/corosync.log
    to_syslog: yes
    logger_subsys {
        subsys: QUORUM
        debug: off
    }
}
