name: Build OpenWrt QNetd

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target Architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'glinet-aarch64 (GL.iNet Flint / Beryl AX Cortex-A53)'
          - 'armsr-armv8 (Generic ARM64 / RPi4 / VM)'
          - 'mediatek-filogic (GL.iNet Flint 2 GL-MT6000)'
          - 'x86-64 (Intel/AMD x86_64)'
      openwrt_version:
        description: 'OpenWrt Version'
        required: true
        default: '23.05.5'
        type: choice
        options:
          - '23.05.5'
          - '23.05.4'
          - '23.05.3'
      create_release:
        description: 'Publish as GitHub Release with attached IPKs'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag, corosync style (e.g. v3.0.4)'
        required: false
        default: 'v3.0.4'
        type: string
      release_run_id:
        description: 'Existing run ID to publish from (skips the build jobs)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  matrix-prep:
    runs-on: ubuntu-22.04
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
    steps:
      - id: set-targets
        run: |
          CHOICE="${{ github.event.inputs.target || 'all' }}"
          GLINET='{"target_id":"glinet-aarch64","target":"armsr","subtarget":"armv8","repack_arch":"aarch64_cortex-a53_neon-vfpv4"}'
          ARMSR='{"target_id":"armsr-armv8","target":"armsr","subtarget":"armv8","repack_arch":""}'
          FILOGIC='{"target_id":"mediatek-filogic","target":"mediatek","subtarget":"filogic","repack_arch":""}'
          X86='{"target_id":"x86-64","target":"x86","subtarget":"64","repack_arch":""}'
          # A one-element base matrix plus `include` appends every unmatched
          # include entry, so selection must produce the full matrix objects.
          case "$CHOICE" in
            all) targets="$GLINET,$ARMSR,$FILOGIC,$X86" ;;
            *glinet-aarch64*) targets="$GLINET" ;;
            *armsr-armv8*) targets="$ARMSR" ;;
            *mediatek-filogic*) targets="$FILOGIC" ;;
            *x86-64*) targets="$X86" ;;
            *) targets="$GLINET" ;;
          esac
          echo "targets=[$targets]" >> $GITHUB_OUTPUT

  build:
    needs: matrix-prep
    if: github.event.inputs.release_run_id == '' || github.event.inputs.release_run_id == null
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix-prep.outputs.targets) }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install Build Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils unzip zlib1g-dev \
            file wget rsync ca-certificates pkg-config autoconf automake libtool patchelf libnss3-tools

      - name: Download & Extract OpenWrt SDK
        run: |
          VERSION="${{ github.event.inputs.openwrt_version || '23.05.5' }}"
          TARGET="${{ matrix.target }}"
          SUBTARGET="${{ matrix.subtarget }}"
          SDK_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${TARGET}/${SUBTARGET}/openwrt-sdk-${VERSION}-${TARGET}-${SUBTARGET}_gcc-12.3.0_musl.Linux-x86_64.tar.xz"

          echo "Downloading OpenWrt SDK: $SDK_URL"
          wget -q "$SDK_URL" -O sdk.tar.xz || \
          wget -q "https://downloads.openwrt.org/releases/23.05.3/targets/${TARGET}/${SUBTARGET}/openwrt-sdk-23.05.3-${TARGET}-${SUBTARGET}_gcc-12.3.0_musl.Linux-x86_64.tar.xz" -O sdk.tar.xz || \
          wget -q "https://downloads.openwrt.org/releases/23.05.3/targets/armsr/armv8/openwrt-sdk-23.05.3-armsr-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz" -O sdk.tar.xz

          tar -xf sdk.tar.xz
          mv openwrt-sdk-* sdk
          rm -f sdk.tar.xz

      - name: Populate Packages & Configure Target
        run: |
          # Copy package/corosync to sdk/package/corosync
          cp -r package/* sdk/package/

          cd sdk
          cat << 'EOF' > .config
          CONFIG_TARGET_${{ matrix.target }}=y
          CONFIG_TARGET_${{ matrix.target }}_${{ matrix.subtarget }}=y
          CONFIG_PACKAGE_libnspr=m
          CONFIG_PACKAGE_libnss=m
          CONFIG_PACKAGE_corosync-qnetd=m
          CONFIG_PACKAGE_corosync-nss-tools=m
          EOF

          make defconfig

      - name: Compile Package Suite
        run: |
          cd sdk
          NPROC=$(nproc)

          echo "=== 1/3: Compiling nspr 4.35 ==="
          make package/corosync/nspr/compile V=s -j${NPROC}

          echo "=== 2/3: Compiling nss 3.98 ==="
          make package/corosync/nss/compile V=s -j${NPROC}

          echo "=== 3/3: Compiling corosync-qnetd 3.0.4 ==="
          make package/corosync/corosync-qnetd/compile V=s -j${NPROC}

      - name: Harvest & Tag Packages
        run: |
          mkdir -p output
          find sdk/bin/packages -name "*.ipk" -exec cp {} output/ \;

          REPACK="${{ matrix.repack_arch }}"
          if [ -n "$REPACK" ]; then
            echo "Repacking architecture string to: $REPACK"
            for ipk in output/*.ipk; do
              [ -f "$ipk" ] || continue
              # Absolute path: the loop body chdirs into $tmpdir before reading $ipk
              ipk_abs=$(readlink -f "$ipk")
              tmpdir=$(mktemp -d)
              tar xzf "$ipk_abs" -C "$tmpdir"
              mkdir "$tmpdir/ctrl"
              tar xzf "$tmpdir/control.tar.gz" -C "$tmpdir/ctrl"
              old_arch=$(sed -n 's/^Architecture: //p' "$tmpdir/ctrl/control")
              sed -i "s/^Architecture: .*/Architecture: ${REPACK}/" "$tmpdir/ctrl/control"
              (cd "$tmpdir/ctrl" && tar czf ../control.tar.gz .)
              rm -rf "$tmpdir/ctrl"
              rm "$ipk_abs"
              (cd "$tmpdir" && tar czf "$ipk_abs" ./debian-binary ./control.tar.gz ./data.tar.gz)
              rm -rf "$tmpdir"
              # Rename to the repacked arch so assets stay unique across targets
              if [ -n "$old_arch" ] && [ "$old_arch" != "$REPACK" ]; then
                new_ipk="${ipk_abs%_${old_arch}.ipk}_${REPACK}.ipk"
                mv "$ipk_abs" "$new_ipk"
              fi
            done
          fi

          cd output
          sha256sum *.ipk > SHA256SUMS.txt
          echo "=== Generated Packages: ==="
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: corosync-ipks-${{ matrix.target_id }}
          path: output/

  release:
    needs: build
    if: |
      !cancelled() && (
        startsWith(github.ref, 'refs/tags/') ||
        (github.event.inputs.create_release == 'true' && needs.build.result == 'success') ||
        (github.event.inputs.release_run_id != '' && github.event.inputs.release_run_id != null)
      )
    runs-on: ubuntu-22.04
    steps:
      - name: Download Artifacts From This Run
        if: github.event.inputs.release_run_id == '' || github.event.inputs.release_run_id == null
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Download Artifacts From Existing Run
        if: github.event.inputs.release_run_id != '' && github.event.inputs.release_run_id != null
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ github.event.inputs.release_run_id }}
        run: |
          mkdir -p release-artifacts
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release-artifacts

      - name: Consolidate Artifacts
        run: |
          mkdir -p release-dist
          for dir in release-artifacts/corosync-ipks-*; do
            [ -d "$dir" ] || continue
            target="${dir##*/corosync-ipks-}"
            mkdir -p "release-dist/$target"
            cp "$dir"/*.ipk "release-dist/$target"/
          done
          ( cd release-dist && find . -name '*.ipk' | sort | xargs -r sha256sum > COMBINED_SHA256SUMS.txt )
          find release-dist -type f | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            release-dist/**/*.ipk
            release-dist/COMBINED_SHA256SUMS.txt
          body: |
            Corosync QNetd 3.0.4 for OpenWrt 23.05, built with NSS 3.98 and NSPR 4.35.

            Assets are grouped per target architecture:

            - `armsr-armv8` - `aarch64_generic` (generic ARM64, Raspberry Pi 4, VMs)
            - `glinet-aarch64` - `aarch64_cortex-a53_neon-vfpv4` (GL.iNet Flint / Beryl AX)
            - `mediatek-filogic` - `aarch64_cortex-a53` (GL.iNet Flint 2 / GL-MT6000)
            - `x86-64` - `x86_64`

            Each target ships `libnspr`, `libnss`, `corosync-qnetd` and `corosync-nss-tools`.

            Install on the router:

            ```
            opkg install --nodeps --force-reinstall libnspr_*.ipk libnss_*.ipk corosync-qnetd_*.ipk corosync-nss-tools_*.ipk
            corosync-qnetd-setup
            /usr/sbin/corosync-qnetd-tool -s
            ```
